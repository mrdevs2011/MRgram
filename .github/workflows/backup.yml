# Haftalik Supabase zaxira (roadmap 7.3): pg_dump -> gpg bilan shifrlash -> artifact (30 kun).
# Kerakli GitHub secrets (Settings -> Secrets -> Actions):
#   SUPABASE_DB_URL     postgresql://postgres:...@db.<ref>.supabase.co:5432/postgres  (Session pooler ham bo'ladi)
#   BACKUP_PASSPHRASE   shifrlash paroli (yo'qotsangiz zaxirani ocholmaysiz — xavfsiz joyga yozib qo'ying)
# Faqat Postgres (schema + data). Storage 'media' bucket fayllari bu yerga kirmaydi.
name: backup

on:
  schedule:
    - cron: '0 3 * * 0'   # har yakshanba 03:00 UTC
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f mrspace.dump
          ls -lh mrspace.dump
      - name: Shifrlash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
              --symmetric --cipher-algo AES256 -o "mrspace-$(date +%F).dump.gpg" mrspace.dump
          rm mrspace.dump
      - uses: actions/upload-artifact@v4
        with:
          name: mrspace-backup
          path: mrspace-*.dump.gpg
          retention-days: 30
